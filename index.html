<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くくポケ - ポケモンカードを集めよう！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: #fff;
            user-select: none;
            height: 100vh;
            overflow: hidden;
        }

        /* 3Dボタン風アニメーション */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        /* カードのホログラム・キラ演出（カード枠内に限定） */
        .card-foil {
            position: relative;
            overflow: hidden;
        }
        .card-foil::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                115deg,
                transparent 25%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 0, 128, 0.4) 50%,
                rgba(0, 255, 255, 0.4) 55%,
                transparent 75%
            );
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0.7;
            animation: foilShift 4s infinite linear;
        }

        @keyframes foilShift {
            0% { transform: translateY(-30%) rotate(25deg); }
            100% { transform: translateY(30%) rotate(25deg); }
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.9), 0 0 5px rgba(255, 255, 255, 0.8), inset 0 0 12px rgba(251, 191, 36, 0.6);
        }

        .super-glow {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9), 0 0 10px rgba(56, 189, 248, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* 震えるアニメーション（間違い時） */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 脈動アニメーション */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

        /* モンスターボールゲットアニメーション */
        @keyframes throwBall {
            0% { transform: translate(-100px, 100px) scale(0.5) rotate(0deg); opacity: 0; }
            50% { transform: translate(0, -30px) scale(1.2) rotate(360deg); opacity: 1; }
            100% { transform: translate(0, 0) scale(1) rotate(720deg); opacity: 1; }
        }
        .animate-throw-ball {
            animation: throwBall 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes ballWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-18deg); }
            75% { transform: rotate(18deg); }
        }
        .animate-ball-wiggle {
            animation: ballWiggle 0.5s ease-in-out 3;
        }

        /* 風で揺れる草むらのアニメーション */
        @keyframes grassSway {
            0%, 100% { transform: skewX(0deg); }
            50% { transform: skewX(-4deg); }
        }
        .animate-grass-sway {
            transform-origin: bottom center;
            animation: grassSway 2.5s ease-in-out infinite;
        }

        /* ミサイル飛翔アニメーション */
        @keyframes flyMissile {
            0% { transform: translate(0, 0) scale(0.6) rotate(15deg); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translate(180px, -10px) scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: translate(210px, 0px) scale(1.2) rotate(0deg); opacity: 0; }
        }
        .animate-fly-missile {
            animation: flyMissile 0.45s ease-in forwards;
        }

        /* 命中時フラッシュ */
        @keyframes hitFlash {
            0% { filter: brightness(1) drop-shadow(0 0 0px red); }
            30% { filter: brightness(2.5) drop-shadow(0 0 15px red); transform: translateX(8px) scale(1.1); }
            60% { filter: brightness(1.8) drop-shadow(0 0 8px red); }
            100% { filter: brightness(1) drop-shadow(0 0 0px red); }
        }
        .animate-hit-flash {
            animation: hitFlash 0.35s ease-out;
        }

        /* ドット絵キャラクターの小刻みなバトルアニメーション */
        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .animate-pixel-bounce {
            animation: pixelBounce 0.4s steps(2) infinite;
        }

        @keyframes pixelMonster {
            0%, 100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-3px) scaleX(1.02); }
        }
        .animate-pixel-monster {
            animation: pixelMonster 0.5s steps(2) infinite;
        }

        /* ドット絵のくっきり描画指定 */
        .pixelated {
            image-rendering: pixelated;
        }

        /* 超豪華レインボーネオンボーダー（全クリア・MUR時） */
        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 25px #ef4444, inset 0 0 15px #ef4444; }
            20% { box-shadow: 0 0 25px #f59e0b, inset 0 0 15px #f59e0b; }
            40% { box-shadow: 0 0 25px #10b981, inset 0 0 15px #10b981; }
            60% { box-shadow: 0 0 25px #06b6d4, inset 0 0 15px #06b6d4; }
            80% { box-shadow: 0 0 25px #8b5cf6, inset 0 0 15px #8b5cf6; }
            100% { box-shadow: 0 0 25px #ec4899, inset 0 0 15px #ec4899; }
        }
        .animate-rainbow-glow {
            animation: rainbowGlow 2s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-100 overflow-hidden relative">

    <!-- お祝い用花火・紙吹雪 Canvas -->
    <canvas id="celebration-canvas" class="pointer-events-none fixed inset-0 z-50 hidden"></canvas>

    <!-- ヘッダーナビゲーション -->
    <header class="bg-slate-900/90 border-b border-indigo-500/30 px-4 py-2.5 shadow-md shrink-0">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="showStageSelect()">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-red-500 to-yellow-400 flex items-center justify-center font-black text-lg shadow-md border-2 border-white text-slate-900">
                    99
                </div>
                <h1 class="font-black text-lg sm:text-xl tracking-wider text-amber-300 drop-shadow">くくポケ</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="showAlbum()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 px-3.5 rounded-full border border-indigo-300/40 flex items-center gap-1.5 shadow-md btn-3d text-xs sm:text-sm">
                    <i data-lucide="book-open" class="w-4 h-4 text-yellow-300"></i>
                    <span>カードずかん (<span id="card-count">0/40</span>)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-3 flex flex-col justify-between overflow-hidden">

        <!-- 1. 段選択画面 -->
        <section id="stage-select-screen" class="flex flex-col justify-between h-full py-2 space-y-3">
            <div class="text-center space-y-1">
                <h2 class="text-xl sm:text-2xl font-extrabold text-white drop-shadow">「ワールド」と「段」をえらぼう！</h2>
                <p class="text-indigo-200 text-xs sm:text-sm">クリアするとポケモンカードをGETできるよ！</p>
            </div>

            <!-- ワールド切り替えタブ (上り・下り・ランダム・マスター) -->
            <div id="world-tabs" class="flex justify-center gap-1.5 max-w-xl mx-auto w-full bg-slate-900/80 p-1.5 rounded-2xl border border-indigo-500/30 overflow-x-auto">
                <button onclick="switchWorld('asc')" id="tab-asc" class="flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-amber-400 text-slate-900 border-2 border-white shadow flex items-center justify-center gap-1">
                    <span>① 上り</span>
                </button>
                <button onclick="switchWorld('desc')" id="tab-desc" class="flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-slate-800 text-slate-400 flex items-center justify-center gap-1">
                    <span>② 下り</span>
                </button>
                <button onclick="switchWorld('rand')" id="tab-rand" class="flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-slate-800 text-slate-400 flex items-center justify-center gap-1">
                    <span>③ ランダム</span>
                </button>
                <button onclick="switchWorld('master')" id="tab-master" class="flex-1 min-w-[100px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-slate-800 text-slate-400 flex items-center justify-center gap-1">
                    <span>④ マスター</span>
                </button>
            </div>

            <!-- 通知用トーストメッセージ -->
            <div id="toast-message" class="hidden transition-all duration-300 transform -translate-y-2 opacity-0 bg-slate-900/95 border-2 border-amber-400 text-amber-200 text-xs sm:text-sm font-black px-4 py-2 rounded-full shadow-2xl text-center max-w-sm mx-auto">
                メッセージ
            </div>

            <div id="stages-grid" class="grid grid-cols-3 gap-3 max-w-xl mx-auto w-full my-auto">
                <!-- JavaScriptで段ボタンが動的に挿入されます -->
            </div>

            <div id="stage-footer-tip" class="text-center text-slate-400 text-[11px]">
                💡 クリアすると次の段がオープン！残りライフが多いほどレアなカードがもらえるよ！
            </div>
        </section>

        <!-- 2. ゲーム画面 -->
        <section id="game-screen" class="hidden flex flex-col justify-between h-full max-w-md mx-auto w-full py-1">
            <!-- 進行度・ヘッダー情報 -->
            <div class="w-full bg-slate-900/80 p-2.5 rounded-2xl border border-indigo-500/30 flex justify-between items-center shadow-lg shrink-0">
                <div class="flex items-center gap-2">
                    <span id="current-stage-title" class="text-lg sm:text-xl font-black text-amber-300">1の段</span>
                    <span id="current-round-tag" class="text-[11px] bg-indigo-500/40 text-indigo-200 px-2 py-0.5 rounded-full border border-indigo-400/30">上りワールド</span>
                </div>
                <!-- ライフ表示 -->
                <div class="flex items-center space-x-1" id="hearts-container">
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                </div>
            </div>

            <!-- マスターモード用 10連四角ゲージ表示エリア -->
            <div id="master-gauge-container" class="hidden w-full bg-slate-900/80 p-2 rounded-xl border border-purple-500/30 flex items-center justify-between gap-2 shadow-md shrink-0 my-1">
                <span class="text-[10px] font-black text-amber-300 shrink-0">のこり</span>
                <div id="master-gauge-boxes" class="flex flex-1 items-center justify-between gap-1">
                    <!-- JSで10個の四角ゲージを動的生成 -->
                </div>
            </div>

            <!-- ドット絵バトルエリア（青空と風に揺れる草むら背景） -->
            <div class="w-full border-2 border-emerald-400/60 rounded-2xl p-2 flex items-center justify-between shrink-0 my-1 relative overflow-hidden h-36 shadow-2xl bg-gradient-to-b from-sky-400 via-sky-200 to-emerald-300">
                
                <!-- 雲アニメーション（背景遠景） -->
                <div class="absolute top-2 left-6 w-12 h-4 bg-white/70 rounded-full blur-[0.5px]"></div>
                <div class="absolute top-4 right-12 w-16 h-5 bg-white/60 rounded-full blur-[0.5px]"></div>

                <!-- 風で揺れる草むらレイヤー（下部） -->
                <div class="absolute bottom-0 inset-x-0 h-10 bg-emerald-500 border-t-2 border-emerald-400 flex items-end justify-around animate-grass-sway overflow-hidden pointer-events-none">
                    <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-b-[18px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-b-[24px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[20px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-b-[26px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[9px] border-l-transparent border-r-[9px] border-r-transparent border-b-[19px] border-b-emerald-600"></div>
                </div>

                <!-- 左：ポケモンマスター -->
                <div class="relative z-10 flex items-center justify-center pl-2">
                    <div class="w-16 h-16 animate-pixel-bounce flex items-center justify-center filter drop-shadow-md">
                        <svg class="w-16 h-16 pixelated" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="8" y="2" width="16" height="4" fill="#ef4444"/>
                            <rect x="6" y="6" width="20" height="2" fill="#ef4444"/>
                            <rect x="18" y="6" width="8" height="2" fill="#ffffff"/>
                            <rect x="6" y="8" width="21" height="2" fill="#b91c1c"/>
                            <rect x="8" y="10" width="14" height="6" fill="#fde047"/>
                            <rect x="10" y="10" width="12" height="6" fill="#fed7aa"/>
                            <rect x="18" y="11" width="3" height="1" fill="#1e293b"/>
                            <rect x="18" y="12" width="2" height="2" fill="#1e293b"/>
                            <rect x="19" y="12" width="1" height="1" fill="#ffffff"/>
                            <rect x="8" y="16" width="16" height="10" fill="#2563eb"/>
                            <rect x="12" y="16" width="8" height="8" fill="#ffffff"/>
                            <rect x="14" y="16" width="4" height="8" fill="#e0f2fe"/>
                            <rect x="4" y="17" width="4" height="6" fill="#1d4ed8"/>
                            <rect x="24" y="17" width="4" height="6" fill="#fed7aa"/>
                            <rect x="10" y="26" width="4" height="5" fill="#1e293b"/>
                            <rect x="18" y="26" width="4" height="5" fill="#1e293b"/>
                            <rect x="8" y="29" width="6" height="2" fill="#ef4444"/>
                            <rect x="18" y="29" width="6" height="2" fill="#ef4444"/>
                        </svg>
                    </div>

                    <!-- 飛んでいくミサイル -->
                    <div id="missile-anim" class="hidden absolute left-12 top-4 z-30 pointer-events-none">
                        <svg class="w-8 h-8 pixelated drop-shadow-lg" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="6" width="10" height="4" fill="#f97316"/>
                            <rect x="12" y="7" width="3" height="2" fill="#ef4444"/>
                            <rect x="0" y="5" width="3" height="2" fill="#ea580c"/>
                            <rect x="0" y="9" width="3" height="2" fill="#ea580c"/>
                            <rect x="4" y="7" width="2" height="2" fill="#fef08a"/>
                        </svg>
                    </div>
                </div>

                <!-- 右：野生のドット絵怪獣 -->
                <div id="wild-pokemon-container" class="relative z-10 flex flex-col items-center justify-center w-36 h-32 pr-2 overflow-visible">
                    <div id="target-pokemon-scale-box" class="transition-transform duration-500 origin-center flex flex-col items-center scale-[2.2]">
                        <div class="animate-pixel-monster flex flex-col items-center">
                            <div id="pixel-monster-svg-box" class="w-16 h-16 filter drop-shadow-xl flex items-center justify-center">
                                <!-- JSで生成されるドット絵 -->
                            </div>
                        </div>
                    </div>

                    <!-- モンスターボールゲット演出用コンテナ -->
                    <div id="pokeball-catch-anim" class="hidden absolute z-30 flex flex-col items-center justify-center pointer-events-none">
                        <div id="pokeball-ball" class="w-10 h-10 filter drop-shadow-2xl">
                            <svg class="w-10 h-10 pixelated" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="8" cy="8" r="7" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                                <path d="M1 8 A 7 7 0 0 1 15 8 Z" fill="#ef4444"/>
                                <line x1="1" y1="8" x2="15" y2="8" stroke="#000000" stroke-width="1.5"/>
                                <circle cx="8" cy="8" r="2.5" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                                <circle cx="8" cy="8" r="1" fill="#000000"/>
                            </svg>
                        </div>
                        <div id="pokeball-got-text" class="hidden text-amber-300 font-black text-xs drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] mt-1 animate-bounce">
                            GET! ✨
                        </div>
                    </div>

                    <div id="hit-explosion" class="hidden absolute z-30 pointer-events-none">
                        <div class="text-3xl animate-ping">💥</div>
                    </div>
                </div>
            </div>

            <!-- 問題表示 -->
            <div class="w-full shrink-0 my-2">
                <div class="w-full h-32 sm:h-36 rounded-2xl bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 border-4 border-white shadow-xl flex flex-col items-center justify-center p-2 text-slate-900 animate-pulse-subtle">
                    <div class="text-[10px] font-black uppercase tracking-widest text-amber-900/80">こうしき</div>
                    <div id="question-text" class="text-4xl sm:text-5xl font-black tracking-wider text-slate-900 my-1">
                        1 × 1
                    </div>
                    <div id="yomi-text" class="text-xs sm:text-sm font-bold text-amber-900 bg-amber-100/90 px-3 py-0.5 rounded-full border border-amber-300">
                        いちいちが
                    </div>
                </div>
            </div>

            <!-- 選択肢 4択 -->
            <div class="w-full shrink-0 my-2">
                <div id="options-grid" class="flex justify-center items-center gap-2 sm:gap-4 w-full">
                    <!-- 動的に生成 -->
                </div>
            </div>

            <div class="text-center text-indigo-300/70 text-[11px] shrink-0">
                せいかいの 丸いカードを選んでね！
            </div>
        </section>

        <!-- 3. クリア演出画面 -->
        <section id="clear-screen" class="hidden flex flex-col justify-center items-center h-full max-w-md mx-auto w-full py-2 relative z-40">
            <div id="clear-modal-box" class="bg-slate-900/95 border-2 border-amber-400/60 rounded-3xl p-5 shadow-2xl w-full text-center space-y-4 relative overflow-hidden">
                <div class="space-y-1">
                    <div id="clear-badge" class="inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-slate-900 shadow">
                        GOLD CLEAR!
                    </div>
                    <h2 id="clear-title" class="text-2xl font-black text-amber-300 drop-shadow">1の段 クリア！</h2>
                    <p id="clear-subtitle" class="text-indigo-200 text-xs sm:text-sm">ポケモンカードを ゲットしたよ！</p>
                    
                    <div id="world-clear-banner" class="hidden my-2 py-2 px-3 bg-gradient-to-r from-amber-400 via-rose-500 to-purple-600 text-white font-black text-sm rounded-xl shadow-lg border-2 border-white animate-bounce">
                        🎉 上りワールド 完全クリア！ 🎉
                    </div>
                </div>

                <!-- 獲得カードプレビュー -->
                <div class="flex justify-center py-1">
                    <div id="reward-card-container" class="transform hover:scale-105 transition-transform duration-300 cursor-pointer">
                        <!-- カードDOM -->
                    </div>
                </div>

                <div class="space-y-2 pt-1">
                    <button id="next-btn" onclick="handleNextStep()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-lg font-black rounded-xl shadow-lg btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <span>つぎへ すすむ</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                    <button onclick="startStage(currentStageNumber)" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white font-black text-base rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        <span>もう１かいする</span>
                    </button>
                    <button onclick="showStageSelect()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2 text-sm">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span>メニューに戻る</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 4. アルバム（カード図鑑）画面 -->
        <section id="album-screen" class="hidden flex flex-col h-full space-y-2 overflow-hidden">
            <div class="flex justify-between items-center border-b border-indigo-500/30 pb-2 shrink-0">
                <div>
                    <h2 class="text-lg sm:text-xl font-black text-amber-300 flex items-center gap-1.5">
                        <i data-lucide="award" class="w-6 h-6 text-yellow-400"></i> ポケモンカードずかん
                    </h2>
                    <p class="text-indigo-200 text-xs">ゲットしたカードをタップして大きくみられるよ！</p>
                </div>
                <button onclick="showStageSelect()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs btn-3d">
                    もどる
                </button>

            const p1Cards = POKEMON_CARDS.filter(c => ['C', 'U', 'R', 'RR'].includes(c.rarity));
            return p1Cards.every(c => gameState.ownedCards.includes(c.id));

        // 図鑑カウント表示更新
        function updateCardCountDisplay() {
            const countEl = document.getElementById('card-count');
            if (!countEl) return;
            
            if (isFirstPhaseComplete()) {
                countEl.innerText = `${gameState.ownedCards.length}/60`;
            } else {
                const p1Cards = POKEMON_CARDS.filter(c => ['C', 'U', 'R', 'RR'].includes(c.rarity));
                const ownedP1Count = p1Cards.filter(c => gameState.ownedCards.includes(c.id)).length;
                countEl.innerText = `${ownedP1Count}/40`;
            }
        }

        // --- セーブ・ロード処理 ---
        function saveData() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify({
                    unlockedStages: gameState.unlockedStages,
                    clearedRanks: gameState.clearedRanks,
                    ownedCards: gameState.ownedCards,
                    newCards: gameState.newCards
                }));
            } catch (e) {
                console.error('Save error:', e);
            }
            updateCardCountDisplay();
        }

        function loadSaveData() {
            try {
                const saved = localStorage.getItem(SAVE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.unlockedStages) gameState.unlockedStages = parsed.unlockedStages;
                    if (parsed.clearedRanks) gameState.clearedRanks = parsed.clearedRanks;
                    if (parsed.ownedCards) gameState.ownedCards = parsed.ownedCards;
                    if (parsed.newCards) gameState.newCards = parsed.newCards;
                }
            } catch (e) {
                console.error('Load error:', e);
            }

            if (!gameState.unlockedStages.asc) gameState.unlockedStages.asc = [1];
            if (!gameState.unlockedStages.desc) gameState.unlockedStages.desc = [1];
            if (!gameState.unlockedStages.rand) gameState.unlockedStages.rand = [1];
            if (!gameState.unlockedStages.master) gameState.unlockedStages.master = [1];

            updateCardCountDisplay();
        }

        // --- サウンド＆音声読み上げ（Web Audio API & SpeechSynthesis） ---
        let audioCtx = null;
        let bgmInterval = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        document.addEventListener('pointerdown', () => { getAudioContext(); }, { once: false });

        function playPinpon() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.50, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, now + 0.15);
            gain2.gain.setValueAtTime(0.3, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.15);
            osc2.stop(now + 0.5);
        }

        function playBuzzer() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(120, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playFanfare(isAllClear = false) {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const notes = isAllClear 
                ? [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50, 1174.66, 1318.51]
                : [523.25, 659.25, 783.99, 1046.50];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.12;
                const duration = idx === notes.length - 1 ? 0.8 : 0.15;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function playCompleteFanfare() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.1;
                const duration = idx === notes.length - 1 ? 1.5 : 0.2;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.35, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function startBGM() {
            stopBGM();
            const ctx = getAudioContext();
            if (!ctx) return;

            const bassNotes = [110, 110, 146.83, 110, 130.81, 110, 123.47, 98];
            const leadNotes = [440, 523.25, 659.25, 587.33, 523.25, 440, 493.88, 523.25];
            let noteIdx = 0;

            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;

                const bassOsc = audioCtx.createOscillator();
                const bassGain = audioCtx.createGain();
                bassOsc.type = 'sawtooth';
                bassOsc.frequency.setValueAtTime(bassNotes[noteIdx % bassNotes.length], now);
                bassGain.gain.setValueAtTime(0.08, now);
                bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                bassOsc.connect(bassGain);
                bassGain.connect(audioCtx.destination);
                bassOsc.start(now);
                bassOsc.stop(now + 0.12);

                const leadOsc = audioCtx.createOscillator();
                const leadGain = audioCtx.createGain();
                leadOsc.type = 'square';
                leadOsc.frequency.setValueAtTime(leadNotes[noteIdx % leadNotes.length], now);
                leadGain.gain.setValueAtTime(0.05, now);
                leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                leadOsc.connect(leadGain);
                leadGain.connect(audioCtx.destination);
                leadOsc.start(now);
                leadOsc.stop(now + 0.14);

                noteIdx++;
            }, 150);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function speakKukuQuestion(num1, num2) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const speakText = (KUKU_SPEAK_YOMI[num1] && KUKU_SPEAK_YOMI[num1][num2]) || `${num1}かける${num2}は`;
            const uttr = new SpeechSynthesisUtterance(speakText);
            uttr.lang = 'ja-JP';
            uttr.rate = 1.1;
            uttr.pitch = 1.2;
            uttr.volume = 1.0;
            window.speechSynthesis.speak(uttr);
        }

        function speakKukuAnswer(answer) {
            if (!('speechSynthesis' in window)) return;

            const speakText = KUKU_ANSWER_SPEAK[answer] || `${answer}`;
            const uttr = new SpeechSynthesisUtterance(speakText);
            uttr.lang = 'ja-JP';
            uttr.rate = 1.1;
            uttr.pitch = 1.2;
            uttr.volume = 1.0;

            setTimeout(() => {
                window.speechSynthesis.speak(uttr);
            }, 200);
        }

        // ワールドの解放判定
        function isWorldUnlocked(world) {
            if (world === 'asc') return true;
            if (world === 'desc') {
                return STAGE_ORDER.every(st => gameState.clearedRanks.asc && gameState.clearedRanks.asc[st]);
            }
            if (world === 'rand') {
                return STAGE_ORDER.every(st => gameState.clearedRanks.desc && gameState.clearedRanks.desc[st]);
            }
            if (world === 'master') {
                return STAGE_ORDER.every(st => gameState.clearedRanks.rand && gameState.clearedRanks.rand[st]);
            }
            return false;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-message');
            if (!toast) return;
            toast.innerText = msg;
            toast.classList.remove('hidden', '-translate-y-2', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('-translate-y-2', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        }

        function switchWorld(world) {
            if (!isWorldUnlocked(world)) {
                if (world === 'desc') {
                    showToast('🔒 「① 上り」を全クリアすると開放！');
                } else if (world === 'rand') {
                    showToast('🔒 「② 下り」を全クリアすると開放！');
                } else if (world === 'master') {
                    showToast('🔒 「③ ランダム」を全クリアすると開放！');
                }
                playBuzzer();
                return;
            }

            gameState.currentWorld = world;
            renderWorldTabs();
            renderStages();
        }

        function renderWorldTabs() {
            const worlds = [
                { id: 'asc', name: '① 上り' },
                { id: 'desc', name: '② 下り' },
                { id: 'rand', name: '③ ランダム' },
                { id: 'master', name: '④ マスター' }
            ];

            worlds.forEach(w => {
                const btn = document.getElementById(`tab-${w.id}`);
                if (!btn) return;

                const unlocked = isWorldUnlocked(w.id);
                const isActive = gameState.currentWorld === w.id;

                if (!unlocked) {
                    btn.className = "flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-slate-900/90 text-slate-500 border border-slate-800 opacity-60 flex items-center justify-center gap-1 cursor-not-allowed";
                    btn.innerHTML = `<i data-lucide="lock" class="w-3.5 h-3.5"></i> <span>${w.name}</span>`;
                } else if (isActive) {
                    const bgClass = w.id === 'master' ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white' : 'bg-amber-400 text-slate-900';
                    btn.className = `flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all ${bgClass} border-2 border-white shadow flex items-center justify-center gap-1`;
                    btn.innerHTML = `<span>${w.name}</span>`;
                } else {
                    btn.className = "flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center gap-1";

            if (window.lucide) lucide.createIcons();

        function renderStages() {
            renderWorldTabs();
            const grid = document.getElementById('stages-grid');
            const tip = document.getElementById('stage-footer-tip');
            if (!grid) return;
            grid.innerHTML = '';

            const world = gameState.currentWorld;

            if (world === 'master') {

                const cleared = gameState.clearedRanks.master[1];
                const btn = document.createElement('button');
                btn.className = `col-span-3 p-5 rounded-3xl border-4 flex flex-col items-center justify-center font-black transition-all bg-gradient-to-r from-purple-600 via-pink-600 to-amber-500 text-white border-yellow-300 shadow-2xl btn-3d animate-pulse-subtle`;
                btn.innerHTML = `
                    <div class="flex items-center gap-2 text-2xl sm:text-3xl font-black">

            const unlocked = gameState.unlockedStages[world] || [1];
            const cleared = gameState.clearedRanks[world] || {};

            STAGE_ORDER.forEach((stageNum) => {
                const isUnlocked = unlocked.includes(stageNum);

        function startStage(stageNum) {
            currentStageNumber = stageNum;
            gameState.currentStage = stageNum;
            gameState.lives = (gameState.currentWorld === 'master') ? 1 : 3;
            gameState.currentQuestionIndex = 0;
            gameState.currentMonsterIndex = 0;
            gameState.questions = generateQuestions(stageNum, gameState.currentWorld);

            hideAllScreens();
            document.getElementById('game-screen').classList.remove('hidden');

            const worldNameMap = { asc: '① 上りワールド', desc: '② 下りワールド', rand: '③ ランダムワールド', master: '④ マスターリーグ' };
            
            if (gameState.currentWorld === 'master') {
                document.getElementById('current-stage-title').innerText = `マスターリーグ`;
            } else {
                document.getElementById('current-stage-title').innerText = `${stageNum}の段`;
            }
            document.getElementById('current-round-tag').innerText = worldNameMap[gameState.currentWorld] || 'ワールド';

            updateHeartsUI();
            updateMasterGaugeUI();
            renderMonsterSvg();
            showQuestion();
            startBGM();
        }

        function generateQuestions(stageNum, world) {
            if (world === 'master') {
                // 6, 7, 8, 9 の段から「×1」を除いた32問のプールを作成し、重複のない10問をランダム選出
                const masterStages = [6, 7, 8, 9];
                const pool = [];
                masterStages.forEach(n1 => {
                    for (let n2 = 2; n2 <= 9; n2++) {
                        pool.push({ num1: n1, num2: n2, answer: n1 * n2 });
                    }
                });
                pool.sort(() => Math.random() - 0.5);
                return pool.slice(0, 10);
            }

            let multiplierList = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            if (world === 'desc') {
                multiplierList = [9, 8, 7, 6, 5, 4, 3, 2, 1];
            } else if (world === 'rand') {
                multiplierList.sort(() => Math.random() - 0.5);
            }
            return multiplierList.map(m => ({
                num1: stageNum,
                num2: m,
                answer: stageNum * m
            }));
        }

        function updateHeartsUI() {
            const container = document.getElementById('hearts-container');
            if (!container) return;
            container.innerHTML = '';
            const totalHearts = (gameState.currentWorld === 'master') ? 1 : 3;

            for (let i = 0; i < totalHearts; i++) {
                const heart = document.createElement('i');
                heart.setAttribute('data-lucide', 'heart');
                if (i < gameState.lives) {
                    heart.className = "w-6 h-6 text-red-500 fill-red-500";
                } else {
                    heart.className = "w-6 h-6 text-slate-600 fill-slate-700 opacity-40";
                }
                container.appendChild(heart);
            }
            if (window.lucide) lucide.createIcons();
        }

        // マスターモード専用 10連四角ゲージUI制御
        function updateMasterGaugeUI() {
            const container = document.getElementById('master-gauge-container');
            const boxesContainer = document.getElementById('master-gauge-boxes');
            if (!container || !boxesContainer) return;

                container.classList.add('hidden');

                } else {

                }
                boxesContainer.appendChild(box);

        }

            if (!box) return;

        function showQuestion() {
            isProcessingAnswer = false;
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (!q) return;

            document.getElementById('question-text').innerText = `${q.num1} × ${q.num2}`;

            const yomiDict = KUKU_YOMI[q.num1] || {};
            document.getElementById('yomi-text').innerText = yomiDict[q.num2] || '';

            speakKukuQuestion(q.num1, q.num2);

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            const shuffled = generateSmartOptions(q);

            shuffled.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = "w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-indigo-600 via-blue-500 to-cyan-400 border-4 border-white text-white text-xl sm:text-2xl font-black shadow-xl btn-3d flex items-center justify-center hover:scale-105 transition-transform";
                btn.innerText = ans;
                btn.onclick = (e) => checkAnswer(ans, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function generateSmartOptions(q) {
            const num1 = q.num1;
            const num2 = q.num2;
            const answer = q.answer;

            const candidates = new Set();

            [num2 - 1, num2 + 1, num2 - 2, num2 + 2].forEach(n2 => {
                if (n2 >= 1) {
                    const val = num1 * n2;
                    if (val > 0 && val !== answer) candidates.add(val);
                }
            });

            [num1 - 1, num1 + 1].forEach(n1 => {
                if (n1 >= 1 && n1 <= 9) {
                    const val = n1 * num2;
                    if (val > 0 && val !== answer) candidates.add(val);
                }
            });

            [answer - 1, answer + 1, answer - 2, answer + 2, answer - 10, answer + 10].forEach(val => {
                if (val > 0 && val <= 81 && val !== answer) candidates.add(val);
            });

            const allProducts = [];
            for (let i = 1; i <= 9; i++) {
                for (let j = 1; j <= 9; j++) {
                    allProducts.push(i * j);
                }
            }
            allProducts.sort((a, b) => Math.abs(a - answer) - Math.abs(b - answer));
            allProducts.forEach(val => {
                if (val !== answer) candidates.add(val);
            });

            const sortedCandidates = Array.from(candidates).sort((a, b) => Math.abs(a - answer) - Math.abs(b - answer));
            const topPool = sortedCandidates.slice(0, Math.min(7, sortedCandidates.length));
            topPool.sort(() => Math.random() - 0.5);

            const wrongOptions = topPool.slice(0, 3);
            const result = [answer, ...wrongOptions];

            return result.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selectedAns, btn) {
            if (isProcessingAnswer) return;
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (!q) return;

            if (selectedAns === q.answer) {
                isProcessingAnswer = true;
                playPinpon();
                speakKukuAnswer(q.answer);

                btn.classList.remove('from-indigo-600', 'via-blue-500', 'to-cyan-400');
                btn.classList.add('from-emerald-400', 'to-teal-500', 'scale-110');

                const missile = document.getElementById('missile-anim');
                if (missile) {
                    missile.classList.remove('hidden');
                    missile.classList.add('animate-fly-missile');
                    setTimeout(() => {
                        missile.classList.add('hidden');
                        missile.classList.remove('animate-fly-missile');
                        
                        const hit = document.getElementById('hit-explosion');
                        if (hit) {
                            hit.classList.remove('hidden');
                            setTimeout(() => hit.classList.add('hidden'), 350);
                        }
                    }, 400);
                }

                setTimeout(() => {
                    gameState.currentQuestionIndex++;
                    updateMasterGaugeUI();
                    if (gameState.currentQuestionIndex >= gameState.questions.length) {
                        // 最終問題クリア時：上部アニメーションエリアでモンスターボール捕獲演出を実行
                        playCatchPokemonAnimation(() => {
                            handleStageClear();
                        });
                    } else {
                        renderMonsterSvg();
                        showQuestion();
                    }
                }, 1200);

            } else {
                playBuzzer();
                btn.classList.add('animate-shake', 'from-rose-600', 'to-red-700');
                setTimeout(() => btn.classList.remove('animate-shake'), 400);

                gameState.lives--;
                updateHeartsUI();

                if (gameState.lives <= 0) {
                    stopBGM();
                    document.getElementById('gameover-modal').classList.remove('hidden');
                }
            }
        }

        // クリア時のモンスターボール確保アニメーション処理
        function playCatchPokemonAnimation(onComplete) {
            const targetBox = document.getElementById('target-pokemon-scale-box');
            const ballContainer = document.getElementById('pokeball-catch-anim');
            const ball = document.getElementById('pokeball-ball');
            const gotText = document.getElementById('pokeball-got-text');

            if (!targetBox || !ballContainer || !ball) {
                onComplete();
                return;
            }

            // 野生ポケモンの縮小消滅
            targetBox.style.transition = 'all 0.5s ease-in-out';
            targetBox.style.opacity = '0';
            targetBox.style.transform = 'scale(0)';

            // モンスターボール登場・投擲演出
            ballContainer.classList.remove('hidden');
            gotText.classList.add('hidden');
            ball.className = "w-10 h-10 filter drop-shadow-2xl animate-throw-ball";

            setTimeout(() => {
                // ボールが地面でゆらゆら揺れる演出
                ball.className = "w-10 h-10 filter drop-shadow-2xl animate-ball-wiggle";
                setTimeout(() => {
                    // カチッ！GET演出
                    gotText.classList.remove('hidden');
                    playPinpon();

                    setTimeout(() => {
                        // リセットしてクリア画面へ移動
                        ballContainer.classList.add('hidden');
                        targetBox.style.opacity = '1';
                        onComplete();
                    }, 1000);
                }, 1500);
            }, 600);

        function handleStageClear() {
            stopBGM();

            const world = gameState.currentWorld;
            const stage = gameState.currentStage;

            let rank = 'bronze';
            if (gameState.lives === 3 || world === 'master') rank = 'gold';
            else if (gameState.lives === 2) rank = 'silver';

            const isAlreadyCleared = !!gameState.clearedRanks[world][stage];

            const currentRank = gameState.clearedRanks[world][stage];
            const rankWeight = { gold: 3, silver: 2, bronze: 1 };
            if (!currentRank || rankWeight[rank] > (rankWeight[currentRank] || 0)) {
                gameState.clearedRanks[world][stage] = rank;
            }

            if (world !== 'master') {
                const currentIndex = STAGE_ORDER.indexOf(stage);
                if (currentIndex >= 0 && currentIndex < STAGE_ORDER.length - 1) {
                    const nextStageNum = STAGE_ORDER[currentIndex + 1];
                    if (!gameState.unlockedStages[world].includes(nextStageNum)) {
                        gameState.unlockedStages[world].push(nextStageNum);
                    }
                }
            }

            const prevOwnedCount = gameState.ownedCards.length;
            const prevPhase1Cleared = isFirstPhaseComplete();

            // カード選出ロジック
            const newCard = getRandomPokemonCard(rank, stage, world, isAlreadyCleared);
            if (newCard) {
                if (!gameState.ownedCards.includes(newCard.id)) {
                    // 初めて引いた新カードの場合のみ ownedCards と newCards に追加
                    gameState.ownedCards.push(newCard.id);
                    if (!gameState.newCards.includes(newCard.id)) {
                        gameState.newCards.push(newCard.id);
                    }
                } else {
                    // すでに所持しているカード（かぶり）を再度引いた場合は「NEW!」を表示しない
                    const idx = gameState.newCards.indexOf(newCard.id);
                    if (idx !== -1) {
                        gameState.newCards.splice(idx, 1);
                    }
                }
            }

            saveData();

            const currentOwnedCount = gameState.ownedCards.length;
            const currentPhase1Cleared = isFirstPhaseComplete();

            const clearBadge = document.getElementById('clear-badge');
            if (rank === 'gold') {
                clearBadge.innerText = '🥇 PERFECT GOLD!';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-slate-900 shadow gold-glow';
            } else if (rank === 'silver') {
                clearBadge.innerText = '🥈 SILVER CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-slate-300 text-slate-900 shadow';
            } else {
                clearBadge.innerText = '🥉 BRONZE CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-700 text-white shadow';
            }

            document.getElementById('clear-title').innerText = (world === 'master') ? `マスターリーグ クリア！` : `${stage}の段 クリア！`;

            const banner = document.getElementById('world-clear-banner');

            // 演出制御: 40枚達成時、60枚達成時、および60枚達成後のクリア毎のみ派手な演出を行う
            const reached40 = !prevPhase1Cleared && currentPhase1Cleared;
            const reached60 = (prevOwnedCount < 60) && (currentOwnedCount === 60);
            const isAlwaysCelebrate = (currentOwnedCount === 60);

            if (reached60) {
                banner.innerText = '👑 カード図鑑 60種コンプリート達成！！ 👑';
                banner.classList.remove('hidden');
                launchCelebration(true, true);
                playCompleteFanfare();
            } else if (reached40) {
                banner.innerText = '✨ RRまで40種コンプリート！AR〜MUR解禁！！ ✨';
                banner.classList.remove('hidden');
                launchCelebration(false, true);
                playFanfare(true);
            } else if (isAlwaysCelebrate) {
                banner.innerText = '👑 図鑑コンプリート中！ 👑';
                banner.classList.remove('hidden');
                launchCelebration(false, false);
                playFanfare(false);
            } else {
                banner.classList.add('hidden');
            }

            const cardBox = document.getElementById('reward-card-container');
            if (cardBox && newCard) {
                cardBox.innerHTML = createCardHtml(newCard);
            }

            hideAllScreens();
            document.getElementById('clear-screen').classList.remove('hidden');
        }

        // --- ドロップ上限＆確率判定ロジック ---
        function getRandomPokemonCard(rank, stageNum, world, isAlreadyCleared) {
            const isPhase1Done = isFirstPhaseComplete();

            // 図鑑40枚（RRまで）未コンプ時は、マスター含めて絶対に対象カードを C, U, R, RR のみに厳格制限
            let basePool = POKEMON_CARDS;
            if (!isPhase1Done) {
                basePool = POKEMON_CARDS.filter(c => ['C', 'U', 'R', 'RR'].includes(c.rarity));
            }

            const unownedCards = basePool.filter(c => !gameState.ownedCards.includes(c.id));

            // C未コンプ時の場合：Uが先に多く集まらないよう85%の確率でCの中からドロップ
            const isCComplete = POKEMON_CARDS.filter(c => c.rarity === 'C').every(c => gameState.ownedCards.includes(c.id));

            // マスターモードでの制御：かぶる率を2%（98%の確率でNEW未所持カード）
            if (world === 'master' && unownedCards.length > 0) {
                if (Math.random() < 0.98) {
                    return pickWeightedCard(unownedCards);
                }
            } else if (isPhase1Done && unownedCards.length > 0) {
                // 40枚集まった後の確率制御 (6~9の段 or ランダム時: 90%NEW / その他: 95%被り)
                const isHighStage = (stageNum >= 6 || world === 'rand');
                if (isHighStage) {
                    // 90%の確率で未所持カード(NEW)を選択
                    if (Math.random() < 0.90) {
                        return pickWeightedCard(unownedCards);
                    }
                } else {
                    // それ以外の段(1~5の段)は95%の確率で被り
                    if (Math.random() < 0.95 && gameState.ownedCards.length > 0) {
                        const ownedPool = basePool.filter(c => gameState.ownedCards.includes(c.id));
                        return pickWeightedCard(ownedPool);
                    }
                }
            } else if (!isPhase1Done && isAlreadyCleared && gameState.ownedCards.length > 0) {
                // 前半40枚未コンプ時の再挑戦被り判定
                const dupRate = (stageNum === 1 || stageNum === 5) ? 0.95 : 0.85;
                if (Math.random() < dupRate) {
                    const ownedPool = basePool.filter(c => gameState.ownedCards.includes(c.id));
                    if (ownedPool.length > 0) {
                        return pickWeightedCard(ownedPool);
                    }
                }
            }

            // ワールド＆段ごとの基本レアリティ定義
            let allowedRarities = ['C', 'U'];

            if (world === 'asc' || world === 'desc') {
                if (stageNum === 1 || stageNum === 5 || stageNum === 2) {
                    allowedRarities = ['C', 'U'];
                } else if (stageNum === 3 || stageNum === 4) {
                    allowedRarities = ['C', 'U', 'R'];
                } else {
                    allowedRarities = ['C', 'U', 'R', 'RR'];
                }
            } else if (world === 'rand') {
                if (stageNum === 1 || stageNum === 5 || stageNum === 2) {
                    allowedRarities = ['C', 'U', 'R'];
                } else if (stageNum === 3 || stageNum === 4) {
                    allowedRarities = ['C', 'U', 'R', 'RR'];
                } else {
                    allowedRarities = ['C', 'U', 'R', 'RR', 'AR', 'SR'];
                }
            } else if (world === 'master') {
                allowedRarities = ['C', 'U', 'R', 'RR', 'AR', 'SR', 'SAR', 'UR', 'MUR'];
            }

            // 図鑑40枚未コンプ時はAR〜MURを除外（絶対ストッパー）
            if (!isPhase1Done) {
                allowedRarities = allowedRarities.filter(r => ['C', 'U', 'R', 'RR'].includes(r));
            }

            // 【厳格ルール】1の段・5の段ではRR以上のカードは絶対に出ない
            if (stageNum === 1 || stageNum === 5) {
                allowedRarities = allowedRarities.filter(r => r === 'C' || r === 'U' || r === 'R');
            }

            // C未コンプ時のバイアス：UよりCが優先して出やすくなる処理
            if (!isCComplete && allowedRarities.includes('C') && Math.random() < 0.85) {
                allowedRarities = ['C'];
            }

            // 選出可能なレアリティのカードリスト
            let targetPool = basePool.filter(c => allowedRarities.includes(c.rarity));

            // 未所持カードがあれば優先して選択
            const unownedInPool = targetPool.filter(c => !gameState.ownedCards.includes(c.id));
            const finalPool = (unownedInPool.length > 0) ? unownedInPool : targetPool;

            if (finalPool.length === 0) return basePool[0] || POKEMON_CARDS[0];

            return pickWeightedCard(finalPool);
        }

        function handleNextStep() {
            const world = gameState.currentWorld;
            const stage = gameState.currentStage;

            if (world === 'master') {
                showStageSelect();
                return;
            }

            const currentIndex = STAGE_ORDER.indexOf(stage);
            if (currentIndex >= 0 && currentIndex < STAGE_ORDER.length - 1) {
                const nextStageNum = STAGE_ORDER[currentIndex + 1];
                if (gameState.unlockedStages[world].includes(nextStageNum)) {
                    startStage(nextStageNum);
                    return;
                }
            }
            showStageSelect();
        }

            else if (card.rarity === 'AR') borderStyle = 'border-amber-400 gold-glow';
            else if (card.rarity === 'SR') borderStyle = 'border-pink-400 super-glow';
            else if (card.rarity === 'SAR') borderStyle = 'border-cyan-300 super-glow';
            else if (card.rarity === 'UR') borderStyle = 'border-yellow-300 gold-glow';

                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] text-slate-300 font-bold">HP</span>
                            <span class="font-black text-xs sm:text-sm text-red-400">${card.hp}</span>
                            <span class="text-[10px] ${card.typeBg} px-1.5 py-0.5 rounded-full font-bold ml-1">${card.type}</span>
                        </div>
                    </div>

                    <!-- イラストエリア -->
                    <div class="w-full h-32 sm:h-36 rounded-xl ${imgBgStyle} border ${innerBorder} flex items-center justify-center relative overflow-hidden my-1 shadow-inner z-10">
                        <div class="transform hover:scale-110 transition-transform duration-300 filter drop-shadow-xl" style="transform: scale(${card.scale || 1.0})">
                            ${svgArt}
                        </div>
                    </div>

                    <!-- ワザエリア -->
                    <div class="bg-slate-800/90 rounded-xl p-1.5 border border-white/10 space-y-1 z-10">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-1">
                                <span class="text-xs">${card.cost}</span>
                                <span class="font-black text-xs text-white">${card.attack}</span>
                            </div>
                            <span class="font-black text-sm text-amber-300">${card.damage}</span>
                        </div>
                    </div>

                    <!-- フッター (レアリティ表記) -->
                    <div class="flex justify-between items-center text-[10px] pt-0.5 border-t border-white/10 z-10">
                        <span class="text-slate-400 font-mono">No.${card.id.replace('p', '').padStart(3, '0')}</span>
                        <span class="px-2 py-0.5 rounded ${rarityBadgeColors[card.rarity] || 'bg-slate-700 text-white'}">${card.rarity}</span>
                    </div>
                </div>
            `;
        }

        // ポケモンのイラスト描画用SVG
        function getPokemonSvgArt(card) {
            const color = card.accentColor || '#f59e0b';
            
            // ピカチュウ系
            if (['p6', 'p11', 'p21', 'p31', 'p59'].includes(card.id)) {
                return `
                    <svg class="w-20 h-20 pixelated" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="2" width="4" height="8" fill="#1e293b"/>
                        <rect x="24" y="2" width="4" height="8" fill="#1e293b"/>
                        <rect x="6" y="6" width="4" height="6" fill="#facc15"/>
                        <rect x="22" y="6" width="4" height="6" fill="#facc15"/>
                        <rect x="8" y="10" width="16" height="14" fill="#facc15"/>
                        <rect x="10" y="14" width="3" height="3" fill="#000000"/>
                        <rect x="19" y="14" width="3" height="3" fill="#000000"/>
                        <rect x="8" y="18" width="3" height="3" fill="#ef4444"/>
                        <rect x="21" y="18" width="3" height="3" fill="#ef4444"/>
                        <rect x="14" y="19" width="4" height="2" fill="#000000"/>
                        <rect x="10" y="24" width="4" height="5" fill="#facc15"/>
                        <rect x="18" y="24" width="4" height="5" fill="#facc15"/>
                    </svg>
                `;
            }
            
            // リザードン・炎系
            if (['p13', 'p18', 'p26', 'p27', 'p32', 'p51'].includes(card.id)) {
                return `
                    <svg class="w-20 h-20 pixelated" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="8" y="4" width="16" height="18" fill="#ea580c"/>
                        <rect x="10" y="8" width="4" height="4" fill="#000000"/>
                        <rect x="18" y="8" width="4" height="4" fill="#000000"/>
                        <rect x="12" y="14" width="8" height="4" fill="#fef08a"/>
                        <rect x="4" y="10" width="4" height="8" fill="#c2410c"/>
                        <rect x="24" y="10" width="4" height="8" fill="#c2410c"/>
                        <rect x="10" y="22" width="12" height="6" fill="#ea580c"/>
                        <rect x="22" y="22" width="6" height="4" fill="#ef4444"/>
                    </svg>
                `;
            }

            // カメックス・ポッチャマ・水系
            if (['p5', 'p14', 'p15', 'p16', 'p23', 'p24', 'p25', 'p28', 'p33', 'p36', 'p43', 'p49', 'p58'].includes(card.id)) {
                return `
                    <svg class="w-20 h-20 pixelated" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="8" y="6" width="16" height="16" fill="#38bdf8"/>
                        <rect x="10" y="8" width="4" height="4" fill="#ffffff"/>
                        <rect x="18" y="8" width="4" height="4" fill="#ffffff"/>
                        <rect x="11" y="9" width="2" height="2" fill="#000000"/>
                        <rect x="19" y="9" width="2" height="2" fill="#000000"/>
                        <rect x="12" y="14" width="8" height="4" fill="#fde047"/>
                        <rect x="10" y="20" width="12" height="8" fill="#0284c7"/>
                        <rect x="12" y="22" width="8" height="6" fill="#ffffff"/>
                    </svg>
                `;
            }

            // 汎用ドット絵（アルセウス・その他）
            return `
                <svg class="w-20 h-20 pixelated" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="8" y="6" width="16" height="16" fill="${color}"/>
                    <rect x="10" y="10" width="4" height="4" fill="#ffffff"/>
                    <rect x="18" y="10" width="4" height="4" fill="#ffffff"/>
                    <rect x="11" y="11" width="2" height="2" fill="#000000"/>
                    <rect x="19" y="11" width="2" height="2" fill="#000000"/>
                    <rect x="12" y="16" width="8" height="3" fill="#1e293b"/>
                    <rect x="10" y="22" width="12" height="6" fill="${color}"/>
                </svg>
            `;
        }

        // 図鑑フィルターバー生成
        function renderAlbumFilterBar() {
            const container = document.getElementById('album-filter-bar');
            if (!container) return;
            container.innerHTML = '';

            let rarities = ['ALL', 'C', 'U', 'R', 'RR'];
            if (isFirstPhaseComplete()) {
                rarities = ['ALL', 'C', 'U', 'R', 'RR', 'AR', 'SR', 'SAR', 'UR', 'MUR'];
            }

            rarities.forEach(r => {
                const btn = document.createElement('button');
                const isActive = currentAlbumFilter === r;
                btn.className = isActive 
                    ? "px-3 py-1 rounded-full text-xs font-black bg-amber-400 text-slate-900 border border-white shadow shrink-0" 
                    : "px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 shrink-0 border border-slate-700";
                btn.innerText = r;
                btn.onclick = () => renderAlbum(r);
                container.appendChild(btn);
            });
        }

        function showAlbum() {
            hideAllScreens();
            document.getElementById('album-screen').classList.remove('hidden');
            renderAlbumFilterBar();
            renderAlbum(currentAlbumFilter);
        }

        function renderAlbum(filter = 'ALL') {
            currentAlbumFilter = filter;
            renderAlbumFilterBar();

            const grid = document.getElementById('album-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const isPhase1Done = isFirstPhaseComplete();

            let cardList = POKEMON_CARDS;
            if (!isPhase1Done) {
                // RRまでの前半40枚未達成時はAR〜MURはリストから隠す
                cardList = POKEMON_CARDS.filter(c => ['C', 'U', 'R', 'RR'].includes(c.rarity));
            }

            if (filter !== 'ALL') {
                cardList = cardList.filter(c => c.rarity === filter);
            }

            cardList.forEach(card => {
                const isOwned = gameState.ownedCards.includes(card.id);
                const item = document.createElement('div');
                item.className = "flex justify-center items-center cursor-pointer transform hover:scale-105 transition-transform";

                if (isOwned) {
                    item.innerHTML = createCardHtml(card);
                    item.onclick = () => openCardModal(card.id);
                } else {
                    item.innerHTML = `
                        <div class="w-full h-48 sm:h-56 rounded-2xl border-2 border-slate-700/80 bg-slate-900/80 p-3 flex flex-col items-center justify-center text-slate-500 shadow-inner">
                            <i data-lucide="lock" class="w-8 h-8 mb-2 text-slate-600"></i>
                            <span class="text-xs font-black text-slate-400">???</span>
                            <span class="text-[10px] text-slate-500 mt-1 font-mono">No.${card.id.replace('p', '').padStart(3, '0')}</span>
                            <span class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded mt-2 border border-slate-700">${card.rarity}</span>
                        </div>
                    `;
                }
                grid.appendChild(item);
            });

            if (window.lucide) lucide.createIcons();
        }

        function openCardModal(cardId) {
            const card = POKEMON_CARDS.find(c => c.id === cardId);
            if (!card) return;

            // 新規フラグ解除
            const idx = gameState.newCards.indexOf(cardId);
            if (idx !== -1) {
                gameState.newCards.splice(idx, 1);
                saveData();
            }

            const modalContainer = document.getElementById('modal-card-container');
            if (modalContainer) {
                modalContainer.innerHTML = createCardHtml(card);
            }

            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
            if (!document.getElementById('album-screen').classList.contains('hidden')) {
                renderAlbum(currentAlbumFilter);
            }
        }

        function retryCurrentStage() {
            document.getElementById('gameover-modal').classList.add('hidden');
            startStage(currentStageNumber);
        }

        // 紙吹雪・花火演出
        function launchCelebration(isAll60 = false, isPhase40 = false) {
            const canvas = document.getElementById('celebration-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.classList.remove('hidden');

            const particles = [];
            const count = isAll60 ? 150 : (isPhase40 ? 100 : 60);
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899', '#fde047', '#ffffff'];

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 200,
                    y: canvas.height / 2 + (Math.random() - 0.5) * 100,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.8) * 14,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    gravity: 0.25,
                    alpha: 1.0,
                    decay: Math.random() * 0.015 + 0.008
                });
            }

            let animationId;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.alpha -= p.decay;

                    if (p.alpha > 0) {
                        alive = true;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });

                if (alive) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    canvas.classList.add('hidden');
                    cancelAnimationFrame(animationId);
                }
            }

            animate();
        }

        // 初期ロード実行
        window.addEventListener('DOMContentLoaded', () => {
            loadSaveData();
            showStageSelect();
        });
    </script>
